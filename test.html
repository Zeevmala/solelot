    // >>> COPIED FROM app.js - exact copies, do not edit here (change app.js, then copy again)
const EARTH_RADIUS_KM = 6371;

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function fuzzyMatch(text, query, maxDist = 2) {
    if (!text || !query) return false;
    if (text.includes(query)) return true;
    if (query.length <= 2) return false; // too short for fuzzy
    if (Math.abs(text.length - query.length) > 3) return false; // too different to match

    // Sliding window Levenshtein: check if any substring of text
    // of length ~query.length is within maxDist edits
    const qLen = query.length;
    const tLen = text.length;

    // Initialize DP row — allow free start position in text
    let prev = new Array(qLen + 1);
    for (let j = 0; j <= qLen; j++) prev[j] = j;

    for (let i = 1; i <= tLen; i++) {
        const curr = new Array(qLen + 1);
        curr[0] = 0; // free start position
        for (let j = 1; j <= qLen; j++) {
            const cost = text[i - 1] === query[j - 1] ? 0 : 1;
            curr[j] = Math.min(
                prev[j] + 1,      // deletion
                curr[j - 1] + 1,  // insertion
                prev[j - 1] + cost // substitution
            );
        }
        // Check if we found a good enough match ending here
        if (curr[qLen] <= maxDist) return true;
        prev = curr;
    }
    return false;
}

function normalizeText(text, keepDoubled = false) {
    let result = String(text || '')
        .toLowerCase()
        .replace(/["'\u05F4\u201C\u201D\u05F3\u2018\u2019]/g, '')
        .replace(/[-\u05BE\u2013]/g, ' ');
    if (!keepDoubled) result = result.replace(/י+/g, 'י').replace(/ו+/g, 'ו');
    return result.replace(/\s+/g, ' ').trim();
}

const QUERY_ALIASES = {
    'ת"א': 'תל אביב',
    'תל אביב יפו': 'תל אביב',
    'tel aviv': 'תל אביב',
    'ראשל"צ': 'ראשון לציון',

    'פ"ת': 'פתח תקווה',
    'ב"ש': 'באר שבע',
    'ר"ג': 'רמת גן',
    'כפ"ס': 'כפר סבא',
    'י-ם': 'ירושלים',
    'נצרת עילית': 'נוף הגליל',
    'נצרת עלית': 'נוף הגליל',
    'זכרון יעקב': 'זיכרון יעקב',
    'יקנעם': 'יוקנעם',
    'יקנעם עילית': 'יוקנעם',
    'יוקנעם עילית': 'יוקנעם',
    'שוהם': 'שהם',
    'יהוד מונוסון': 'יהוד',
    'מודיעין מכבים רעות': 'מודיעין',
    'פרדס חנה כרכור': 'פרדס חנה',
    'כ"ס': 'כפר סבא',
    // English names of the large cities
    'jerusalem': 'ירושלים',
    'haifa': 'חיפה',
    'beer sheva': 'באר שבע',
    'petah tikva': 'פתח תקווה',
    'rishon lezion': 'ראשון לציון',
    'netanya': 'נתניה',
    'ashdod': 'אשדוד',
    'holon': 'חולון',
    'ramat gan': 'רמת גן',
    'bnei brak': 'בני ברק',
    'eilat': 'אילת',
    // Chains, as people type them
    'bug': 'באג',
    'ikea': 'איקאה',
    'ace': 'אייס',
    'אם פם': 'am.pm',
    'ampm': 'am.pm',
    'am:pm': 'am.pm'
};

function normalizeQuery(text, keepDoubled = false) {
    const query = normalizeText(text);
    const typedQuote = /["\u05F4\u201C\u201D]/.test(String(text || ''));
    const alias = Object.keys(QUERY_ALIASES).find(name =>
        normalizeText(name) === query && (typedQuote || !name.includes('"')));
    return normalizeText(alias ? QUERY_ALIASES[alias] : text, keepDoubled);
}

function locationSearchText(location) {
    const text = [location.name, location.address, location.city].join(' ').replace(/,/g, ' ');
    return { folded: normalizeText(text), asTyped: normalizeText(text, true) };
}


function findContaining(locations, query) {
    const texts = locations.map(location => location.searchText || locationSearchText(location));
    const withAll = (words, kind) => locations.filter((location, i) => words.every(word => texts[i][kind].includes(word)));
    const typed = String(query || '').replace(/,/g, ' '); // an address pasted as written
    const asTyped = normalizeQuery(typed, true);
    const folded = normalizeQuery(typed);
    if (asTyped !== folded) {
        const found = withAll(asTyped.split(' '), 'asTyped');
        if (found.length > 0) return found;
    }
    return withAll(folded.split(' '), 'folded');
}


function fuzzyTolerance(queryLength) {
    if (queryLength < 5) return 0;
    if (queryLength < 8) return 1;
    return 2;
}

function searchLocations(locations, query, cityFilter) {
    if (cityFilter) return locations.filter(location => location.city === cityFilter);

    const q = normalizeQuery(query);
    if (q === '') return locations.slice();

    const exact = findContaining(locations, query);
    if (exact.length > 0) return exact;

    const maxDist = fuzzyTolerance(q.length);
    if (maxDist === 0) return [];
    const fields = locations.map(location => [
        normalizeText(location.name),
        normalizeText(location.address),
        normalizeText(location.city)
    ]);
    return locations.filter((location, i) => fields[i].some(text => fuzzyMatch(text, q, maxDist)));
}

function matchCities(cityCounts, text, exactLocationCount = 0) {
    const query = normalizeQuery(text);
    const maxDist = fuzzyTolerance(query.length);
    const matches = [];
    if (query === '') return matches;
    cityCounts.forEach((count, name) => {
        const city = normalizeText(name);
        if (city.includes(query)) matches.push({ type: 'city', name, count, exact: true, same: city === query });
    });
    if (matches.length === 0 && exactLocationCount === 0 && maxDist > 0) {
        cityCounts.forEach((count, name) => {
            if (fuzzyMatch(normalizeText(name), query, maxDist)) {
                matches.push({ type: 'city', name, count, exact: false, same: false });
            }
        });
    }
    // The city that is the typed text first, then cities containing it, then near
    // matches; inside each group the city with more locations first
    matches.sort((a, b) => {
        if (a.same !== b.same) return a.same ? -1 : 1;
        if (a.exact !== b.exact) return a.exact ? -1 : 1;
        return b.count - a.count;
    });
    return matches;
}

function isValidLocation(loc) {
    if (!loc || !Number.isInteger(loc.id) || loc.id <= 0) return false;
    if (!loc.name || !loc.address || !loc.city || !loc.type) return false;
    if (!['store', 'facility'].includes(loc.type)) return false;
    if (typeof loc.lat !== 'number' || typeof loc.lng !== 'number') return false;
    if (!isFinite(loc.lat) || !isFinite(loc.lng)) return false;
    if (loc.lat < 29 || loc.lat > 34 || loc.lng < 34 || loc.lng > 36) return false;
    return true;
}

function getDistance(lat1, lng1, lat2, lng2) {
    const R = EARTH_RADIUS_KM;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function formatDistance(km) {
    const metres = Math.round(km * 100) * 10;
    if (metres < 1000) return `${metres}\u00A0מ׳`;
    return `${km.toFixed(1)}\u00A0ק"מ`;
}

function chainNotListedText(query) {
    const chains = ['סופר פארם', 'סופרפארם', 'super pharm', 'superpharm', 'אופיס דיפו', 'office depot', 'officedepot',
        'ksp', 'פלאפון', 'pelephone', 'סלקום', 'cellcom'];
    const text = ' ' + normalizeQuery(String(query || '').replace(/,/g, ' ')) + ' ';
    if (text.trim() === '') return '';
    const named = chains.some(chain => text.includes(' ' + normalizeText(chain) + ' '));
    return named ? 'הרשת הזו לא מופיעה ברשימת נקודות האיסוף של תאגיד מ.א.י.' : '';
}

function formatUpdatedDate(isoText) {
    if (typeof isoText !== 'string' || !/^\d{4}-\d{2}-\d{2}T/.test(isoText)) return '';
    const date = new Date(isoText);
    if (isNaN(date.getTime())) return '';
    // JavaScript rolls 30 February over to 2 March instead of refusing it: refuse it here
    const [y, m, d] = isoText.slice(0, 10).split('-').map(Number);
    const asWritten = new Date(Date.UTC(y, m - 1, d));
    if (asWritten.getUTCMonth() !== m - 1 || asWritten.getUTCDate() !== d) return '';
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(date);
    const part = type => Number(parts.find(p => p.type === type).value); // en-GB writes 05, people write 5
    return `${part('day')}.${part('month')}.${part('year')}`;
}

    // <<< END OF COPIES

    // === escapeHtml tests ===
    assert(escapeHtml('hello') === 'hello', 'escapeHtml: plain text unchanged');
    assert(escapeHtml('<script>') === '&lt;script&gt;', 'escapeHtml: escapes angle brackets');
    assert(escapeHtml('"quotes"') === '&quot;quotes&quot;', 'escapeHtml: escapes double quotes');
    assert(escapeHtml("it's") === "it&#039;s", 'escapeHtml: escapes single quotes');
    assert(escapeHtml('a&b') === 'a&amp;b', 'escapeHtml: escapes ampersand');
    assert(escapeHtml('') === '', 'escapeHtml: empty string returns empty');
    assert(escapeHtml(null) === '', 'escapeHtml: null returns empty');
    assert(escapeHtml(undefined) === '', 'escapeHtml: undefined returns empty');
    assert(escapeHtml(123) === '123', 'escapeHtml: number converted to string');

    // === fuzzyMatch tests ===
    assert(fuzzyMatch('\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD', '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD') === true, 'fuzzyMatch: exact match');
    assert(fuzzyMatch('\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD', '\u05D9\u05E8\u05D5\u05E9\u05DC') === true, 'fuzzyMatch: substring match');
    assert(fuzzyMatch('\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD', '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DE') === true, 'fuzzyMatch: 1 char difference');
    assert(fuzzyMatch('hello', 'xyz') === false, 'fuzzyMatch: no match');
    assert(fuzzyMatch('', 'test') === false, 'fuzzyMatch: empty text');
    assert(fuzzyMatch('test', '') === false, 'fuzzyMatch: empty query');
    assert(fuzzyMatch(null, 'test') === false, 'fuzzyMatch: null text');
    assert(fuzzyMatch('abc', 'ab') === true, 'fuzzyMatch: short query substring');
    assert(fuzzyMatch('abc', 'xz') === false, 'fuzzyMatch: short query no match (skips fuzzy)');
    assert(fuzzyMatch('abcdefgh', 'wxyz') === false, 'fuzzyMatch: length difference > 3 returns false');
    assert(fuzzyMatch('בטחה', 'חיפה', 1) === false, 'fuzzyMatch: maxDist=1 rejects distant city');
    assert(fuzzyMatch('חיפה', 'חיפה', 1) === true, 'fuzzyMatch: maxDist=1 exact match');
    assert(fuzzyMatch('חיפה', 'חיפ', 1) === true, 'fuzzyMatch: maxDist=1 substring match');

    // === Search tests (normalizeText, normalizeQuery, fuzzyTolerance, searchLocations) ===
    const names = list => list.map(l => l.id).join(',');
    const places = [
        { id: 1, name: 'סופר פארם', address: 'הנשיא 10', city: 'חדרה' },
        { id: 2, name: 'שופרסל', address: 'הרצל 5', city: 'חדרה' },
        { id: 3, name: 'מכולת חדרה הקטנה', address: 'ויצמן 1', city: 'חיפה' },   // other city, name contains חדרה
        { id: 4, name: 'KSP מחשבים', address: 'דרך חדרה 3', city: 'נתניה' },      // other city, address contains חדרה
        { id: 5, name: 'בית ספר גדרה', address: 'הבנים 2', city: 'גדרה' },         // one letter away from חדרה
        { id: 6, name: 'מרכז מסחרי', address: 'הרצל 1', city: 'לוד' },
        { id: 7, name: 'מרכז מסחרי', address: 'הגפן 4', city: 'לוט' },             // one letter away from לוד
        { id: 8, name: 'בנק', address: 'אלנבי 9', city: 'תל אביב' },
        { id: 9, name: 'ביה״ס אורט', address: 'העצמאות 7', city: 'קרית אתא' },
        { id: 10, name: 'דואר', address: 'יפו 20', city: 'ירושלים' },
        { id: 11, name: 'מתנ"ס', address: 'בן גוריון 8', city: 'ג\'סר א-זרקא' }
    ];

    assert(normalizeText('KSP') === 'ksp', 'normalizeText: Latin letters become lower case');
    assert(normalizeText('ביה״ס') === 'ביהס' && normalizeText('ביה"ס') === 'ביהס', 'normalizeText: double quote marks (Hebrew or plain) are dropped');
    assert(normalizeText('ג׳סר') === 'גסר' && normalizeText("ג'סר") === 'גסר', 'normalizeText: single quote marks (Hebrew or plain) are dropped');
    assert(normalizeText('פתח תקווה') === normalizeText('פתח תקוה'), 'normalizeText: doubled ו equals a single one');
    assert(normalizeText('ירושליים') === normalizeText('ירושלים'), 'normalizeText: doubled י equals a single one');
    assert(normalizeText('תל אביב-יפו') === 'תל אביב יפו', 'normalizeText: hyphen becomes a space');
    assert(normalizeText('קרית אתא') === normalizeText('קריית אתא'), 'normalizeText: קרית equals קריית');
    assert(normalizeText('  תל   אביב ') === 'תל אביב', 'normalizeText: extra spaces removed');
    assert(normalizeText(null) === '', 'normalizeText: null returns empty');

    assert(normalizeQuery('ת"א') === normalizeText('תל אביב'), 'normalizeQuery: alias ת"א');
    assert(normalizeQuery('ת״א') === normalizeText('תל אביב'), 'normalizeQuery: alias ת״א (Hebrew gershayim)');
    assert(normalizeQuery('תל אביב יפו') === normalizeText('תל אביב'), 'normalizeQuery: alias תל אביב יפו');
    assert(normalizeQuery('תל אביב-יפו') === normalizeText('תל אביב'), 'normalizeQuery: alias תל אביב-יפו');
    assert(normalizeQuery('Tel Aviv') === normalizeText('תל אביב'), 'normalizeQuery: alias Tel Aviv');
    assert(normalizeQuery('ראשל"צ') === normalizeText('ראשון לציון'), 'normalizeQuery: alias ראשל"צ');
    assert(normalizeQuery('פ"ת') === normalizeText('פתח תקווה'), 'normalizeQuery: alias פ"ת');
    assert(normalizeQuery('ב"ש') === normalizeText('באר שבע'), 'normalizeQuery: alias ב"ש');
    assert(normalizeQuery('י-ם') === normalizeText('ירושלים'), 'normalizeQuery: alias י-ם');
    assert(normalizeQuery('toString') === 'tostring', 'normalizeQuery: built-in property names are not aliases');
    assert(normalizeQuery('חיפה') === 'חיפה', 'normalizeQuery: other text unchanged');

    assert(normalizeQuery('ראשלצ') === normalizeText('ראשון לציון'), 'normalizeQuery: alias ראשלצ (no quote mark)');
    assert(normalizeQuery('ר"ג') === normalizeText('רמת גן'), 'normalizeQuery: alias ר"ג');
    assert(normalizeQuery('כפ"ס') === normalizeText('כפר סבא'), 'normalizeQuery: alias כפ"ס');
    assert(normalizeQuery('נצרת עלית') === normalizeText('נוף הגליל') && normalizeQuery('נצרת עילית') === normalizeText('נוף הגליל'), 'normalizeQuery: old name נצרת עילית / נצרת עלית');

    // A two-letter short name needs its quote mark (rework after review)
    const shops = [
        { id: 1, name: 'זול בשפע', address: 'הרצל 1', city: 'אשדוד' },
        { id: 2, name: 'פתאל', address: 'הים 2', city: 'אילת' },
        { id: 3, name: 'מרגוע', address: 'הגן 3', city: 'צפת' },
        { id: 4, name: 'תאורה', address: 'הנר 4', city: 'עכו' },
        { id: 5, name: 'מוקד', address: 'רגר 5', city: 'באר שבע' },
        { id: 6, name: 'מוקד', address: 'הרצל 6', city: 'פתח תקווה' },
        { id: 7, name: 'מוקד', address: 'ביאליק 7', city: 'רמת גן' },
        { id: 8, name: 'מוקד', address: 'אלנבי 8', city: 'תל אביב' }
    ];
    const ids = text => searchLocations(shops, text, null).map(l => l.id).join(',');
    assert(normalizeQuery('בש') === 'בש' && normalizeQuery('פת') === 'פת' && normalizeQuery('רג') === 'רג' && normalizeQuery('תא') === 'תא', 'normalizeQuery: bare בש / פת / רג / תא are not short names');
    assert(ids('בש') === '1', 'searchLocations: bare "בש" finds "זול בשפע", not באר שבע (got ' + ids('בש') + ')');
    assert(ids('פת') === '2,3,6', 'searchLocations: bare "פת" is plain text (got ' + ids('פת') + ')');
    assert(ids('רג') === '3,5', 'searchLocations: bare "רג" is plain text (got ' + ids('רג') + ')');
    assert(ids('תא') === '2,4', 'searchLocations: bare "תא" is plain text (got ' + ids('תא') + ')');
    assert(ids('ב"ש') === '5' && ids('ב״ש') === '5', 'searchLocations: ב"ש and ב״ש (with the quote mark) find באר שבע');
    assert(ids('פ"ת') === '6' && ids('ר"ג') === '7' && ids('ת"א') === '8' && ids('ת״א') === '8', 'searchLocations: פ"ת, ר"ג, ת"א with the quote mark find their city');
    assert(matchCities(new Map([['באר שבע', 5]]), 'בש').length === 0 && matchCities(new Map([['באר שבע', 5]]), 'ב"ש')[0].same === true, 'matchCities: Enter picks באר שבע for ב"ש but not for bare בש');

    assert(fuzzyTolerance(3) === 0 && fuzzyTolerance(4) === 0, 'fuzzyTolerance: no edits under 5 letters');
    assert(fuzzyTolerance(5) === 1 && fuzzyTolerance(7) === 1, 'fuzzyTolerance: 1 edit for 5-7 letters');
    assert(fuzzyTolerance(8) === 2 && fuzzyTolerance(20) === 2, 'fuzzyTolerance: 2 edits from 8 letters');

    assert(searchLocations(places, '', null).length === places.length, 'searchLocations: empty text shows everything');
    assert(names(searchLocations(places, 'חדרה', 'חדרה')) === '1,2', 'searchLocations: a picked city shows exactly that city (got ' + names(searchLocations(places, 'חדרה', 'חדרה')) + ')');
    assert(names(searchLocations(places, 'חדרה', null)) === '1,2,3,4', 'searchLocations: typed חדרה shows only records containing חדרה, not גדרה (got ' + names(searchLocations(places, 'חדרה', null)) + ')');
    assert(names(searchLocations(places, 'לוד', null)) === '6', 'searchLocations: short text "לוד" does not match לוט (got ' + names(searchLocations(places, 'לוד', null)) + ')');
    assert(names(searchLocations(places, 'ksp', null)) === '4', 'searchLocations: "ksp" finds KSP');
    assert(names(searchLocations(places, 'ksp', null)) === names(searchLocations(places, 'KSP', null)), 'searchLocations: "ksp" equals "KSP"');
    assert(names(searchLocations(places, 'ת"א', null)) === '8', 'searchLocations: ת"א finds תל אביב');
    assert(names(searchLocations(places, 'ת״א', null)) === '8', 'searchLocations: ת״א finds תל אביב');
    assert(names(searchLocations(places, 'תל אביב יפו', null)) === '8', 'searchLocations: תל אביב יפו finds תל אביב');
    assert(names(searchLocations(places, 'י-ם', null)) === '10', 'searchLocations: י-ם finds ירושלים');
    assert(names(searchLocations(places, 'קריית אתא', null)) === '9', 'searchLocations: קריית finds a record spelled קרית');
    assert(names(searchLocations(places, 'ביה"ס', null)) === '9', 'searchLocations: plain quote finds a name written with ״');
    assert(names(searchLocations(places, 'א זרקא', null)) === '11', 'searchLocations: space finds a name written with a hyphen');
    assert(names(searchLocations(places, 'ירושלם', null)) === '10', 'searchLocations: typing mistake falls back to a near match (ירושלם -> ירושלים)');
    assert(names(searchLocations(places, 'תל אבבי', null)) === '8', 'searchLocations: typing mistake falls back to a near match (תל אבבי -> תל אביב)');
    assert(names(searchLocations(places, 'גדרה', null)) === '5', 'searchLocations: no near matches when the text itself is found');
    assert(searchLocations(places, 'חיפא', null).length === 0, 'searchLocations: no near match for a 4-letter text (0 edits under 5 letters)');
    assert(searchLocations(places, 'zzzzqqqq', null).length === 0, 'searchLocations: nonsense finds nothing');

    // === Common spellings typed in full (rework of A1) ===
    // Each city has 2 points; the "noise" records hold the stray substring hits
    // that used to switch the near-match fallback off.
    const towns = [];
    ['פתח תקווה', 'זיכרון יעקב', 'נוף הגליל', 'יוקנעם', 'שהם', 'ראשון לציון', 'רמת גן', 'כפר סבא', 'יהוד', 'פרדס חנה', 'מודיעין', 'קריית שמונה', 'באר שבע', 'תל אביב', 'ירושלים'].forEach((city, n) => {
        towns.push({ id: 100 + n * 2, name: 'מוקד איסוף', address: 'הראשי 1', city: city });
        towns.push({ id: 101 + n * 2, name: 'מתנ"ס', address: 'הגפן 2', city: city });
    });
    towns.push({ id: 900, name: 'חנות', address: 'פתח תקוה 12', city: 'חולון' });       // street named with the other spelling
    towns.push({ id: 901, name: 'מכולת', address: 'זכרון יעקב 3', city: 'חיפה' });
    towns.push({ id: 902, name: 'קיוסק', address: 'יקנעם 4', city: 'עפולה' });
    towns.push({ id: 903, name: 'מרכז', address: 'שוהם 5', city: 'חיפה' });
    const cityPoints = (query, city) => {
        const found = searchLocations(towns, query, null);
        return found.filter(l => l.city === city).length + '/' + found.length;
    };
    assert(cityPoints('פתח תקוה', 'פתח תקווה') === '2/3', 'spelling: "פתח תקוה" finds the פתח תקווה points (got ' + cityPoints('פתח תקוה', 'פתח תקווה') + ')');
    assert(cityPoints('זכרון יעקב', 'זיכרון יעקב') === '2/2', 'spelling: "זכרון יעקב" finds זיכרון יעקב (got ' + cityPoints('זכרון יעקב', 'זיכרון יעקב') + ')');
    assert(cityPoints('נצרת עילית', 'נוף הגליל') === '2/2', 'spelling: "נצרת עילית" finds נוף הגליל');
    assert(cityPoints('נצרת עלית', 'נוף הגליל') === '2/2', 'spelling: "נצרת עלית" finds נוף הגליל');
    assert(cityPoints('יקנעם', 'יוקנעם') === '2/2', 'spelling: "יקנעם" finds יוקנעם (got ' + cityPoints('יקנעם', 'יוקנעם') + ')');
    assert(cityPoints('שוהם', 'שהם') === '2/2', 'spelling: "שוהם" finds שהם (got ' + cityPoints('שוהם', 'שהם') + ')');
    assert(cityPoints('ראשלצ', 'ראשון לציון') === '2/2', 'spelling: "ראשלצ" finds ראשון לציון');
    assert(cityPoints('ר"ג', 'רמת גן') === '2/2', 'spelling: ר"ג finds רמת גן');
    assert(cityPoints('כפ"ס', 'כפר סבא') === '2/2', 'spelling: כפ"ס finds כפר סבא');
    assert(cityPoints('יהוד מונוסון', 'יהוד') === '2/2', 'spelling: "יהוד מונוסון" finds יהוד');
    assert(cityPoints('פרדס חנה כרכור', 'פרדס חנה') === '2/2', 'spelling: "פרדס חנה כרכור" finds פרדס חנה');
    assert(cityPoints('מודיעין מכבים רעות', 'מודיעין') === '2/2', 'spelling: "מודיעין מכבים רעות" finds מודיעין');
    assert(searchLocations(towns, 'מתנס', null).length === 15, 'spelling: "מתנס" finds every מתנ"ס (got ' + searchLocations(towns, 'מתנס', null).length + ')');
    assert(cityPoints('ירושליים', 'ירושלים') === '2/2', 'spelling: "ירושליים" finds ירושלים');
    assert(cityPoints('קרית שמונה', 'קריית שמונה') === '2/2', 'spelling: "קרית שמונה" finds קריית שמונה');
    assert(cityPoints('באר-שבע', 'באר שבע') === '2/2', 'spelling: "באר-שבע" finds באר שבע');
    assert(cityPoints('תל-אביב', 'תל אביב') === '2/2', 'spelling: "תל-אביב" finds תל אביב');
    assert(cityPoints('tel aviv', 'תל אביב') === '2/2', 'spelling: "tel aviv" finds תל אביב');

    // === Words in any order, across name, address and city (great-map A3) ===
    const streets = [
        { id: 1, name: 'AM.PM - אבן גבירול 91', address: 'אבן גבירול 91, תל אביב', city: 'תל אביב' },
        { id: 2, name: 'מוקד איסוף', address: 'הרצל 3, חיפה', city: 'חיפה' },
        { id: 3, name: 'מוקד איסוף', address: 'הרצל 8, ראשון לציון', city: 'ראשון לציון' },
        { id: 4, name: 'אייס קנה ובנה', address: 'החרש 1, רמת השרון', city: 'רמת השרון' },
        { id: 5, name: 'מוקד איסוף', address: 'סוקולוב 2, רמת השרון', city: 'רמת השרון' },
        { id: 6, name: 'איילת השחר', address: 'הדקל 4, אילת', city: 'אילת' },
        { id: 7, name: 'באג', address: 'דרך השלום 7, תל אביב', city: 'תל אביב' },
        { id: 8, name: 'איקאה', address: 'הנפח 1, ראשון לציון', city: 'ראשון לציון' },
        { id: 9, name: 'מכולת', address: 'העצמאות 7, קריית אתא', city: 'קריית אתא' },
        { id: 10, name: 'ספריה עירונית', address: 'הנשיא 1, נתניה', city: 'נתניה' },
        { id: 11, name: 'דואר', address: 'התמרים 2, אילת', city: 'אילת' },
        { id: 12, name: 'מוקד איסוף', address: 'יפו 20, ירושלים', city: 'ירושלים' }
    ];
    const found = text => searchLocations(streets, text, null).map(l => l.id).join(',');
    assert(found('אבן גבירול תל אביב') === '1', 'words: "אבן גבירול תל אביב" (street then city) finds the point (got ' + found('אבן גבירול תל אביב') + ')');
    assert(found('תל אביב אבן גבירול') === '1', 'words: in any order (got ' + found('תל אביב אבן גבירול') + ')');
    assert(found('הרצל חיפה') === '2', 'words: "הרצל חיפה" finds only הרצל in חיפה, not הרצל in ראשון לציון (got ' + found('הרצל חיפה') + ')');
    assert(found('החרש רמת השרון') === '4', 'words: the comma in "החרש 1, רמת השרון" does not stop a match (got ' + found('החרש רמת השרון') + ')');
    assert(found('החרש 1, רמת השרון') === '4', 'words: the address typed as written, with its comma (got ' + found('החרש 1, רמת השרון') + ')');
    assert(found('אייס קנה') === '4' && found('מוקד רמת השרון') === '5', 'words: name words, and a name word with the city');
    assert(found('אייס') === '4', 'doubled letters: "אייס" finds only records containing אייס, not every מוקד איסוף (got ' + found('אייס') + ')');
    assert(found('איילת') === '6', 'doubled letters: "איילת" does not find the city אילת (got ' + found('איילת') + ')');
    assert(found('קרית אתא') === '9' && found('קריית אתא') === '9', 'doubled letters: "קרית אתא" and "קריית אתא" both find קריית אתא');
    assert(searchLocations(places, 'קריית אתא', null).map(l => l.id).join(',') === '9', 'doubled letters: typed קריית still finds a record spelled קרית (nothing as typed, then folded)');
    assert(cityPoints('פתח תקוה', 'פתח תקווה') === '2/3' && cityPoints('ירושליים', 'ירושלים') === '2/2', 'doubled letters: "פתח תקוה" and "ירושליים" still find their city');
    assert(found('ירושלם') === '12', 'words: the near-match fallback is unchanged (ירושלם -> ירושלים)');
    assert(found('אבן גבירול חיפה') === '', 'words: every word must be found (no אבן גבירול in חיפה)');

    // === English and chain names (aliases) ===
    [['jerusalem', 'ירושלים'], ['Haifa', 'חיפה'], ['beer sheva', 'באר שבע'], ['Petah Tikva', 'פתח תקווה'], ['rishon lezion', 'ראשון לציון'],
     ['netanya', 'נתניה'], ['ashdod', 'אשדוד'], ['holon', 'חולון'], ['ramat gan', 'רמת גן'], ['bnei brak', 'בני ברק'], ['eilat', 'אילת'],
     ['כ"ס', 'כפר סבא'], ['כ״ס', 'כפר סבא'], ['bug', 'באג'], ['ikea', 'איקאה'], ['ace', 'אייס'], ['אם פם', 'am.pm'], ['ampm', 'am.pm'], ['AM:PM', 'am.pm']
    ].forEach(([typed, meant]) => assert(normalizeQuery(typed) === normalizeText(meant), 'alias: "' + typed + '" means ' + meant + ' (got ' + normalizeQuery(typed) + ')'));
    assert(normalizeQuery('כס') === 'כס', 'alias: bare "כס" (no quote mark) is not כפר סבא');
    assert(found('ace') === '4', 'alias: "ace" finds אייס, not every מוקד איסוף (got ' + found('ace') + ')');
    assert(found('bug') === '7' && found('ikea') === '8' && found('haifa') === '2' && found('eilat') === '6,11', 'alias: bug, ikea, haifa, eilat find their records');
    assert(found('אם פם') === '1' && found('ampm') === '1' && found('am:pm') === '1' && found('AM.PM') === '1', 'alias: אם פם / ampm / am:pm find AM.PM');

    // === Near-spelling city rows (matchCities with the count of locations that contain the text) ===
    const near = new Map([['סתריה', 3], ['קיסריה', 12], ['קריית אתא', 30], ['קריית ים', 20], ['קריית ביאליק', 25], ['בת ים', 40], ['עזריאל', 2]]);
    const rows = (text, n) => matchCities(near, text, n).map(c => c.name + (c.same ? '=' : c.exact ? '' : '~')).join(',');
    assert(rows('ספריה', 11) === '', 'matchCities: no near-spelling cities when 11 locations contain "ספריה" (got ' + rows('ספריה', 11) + ')');
    assert(rows('ספריה', 0) === 'קיסריה~,סתריה~', 'matchCities: near-spelling cities still offered when nothing contains the text (got ' + rows('ספריה', 0) + ')');
    assert(rows('קרית אתא', 0) === 'קריית אתא=', 'matchCities: "קרית אתא" offers exactly one city (got ' + rows('קרית אתא', 0) + ')');
    assert(rows('בת ים', 0) === 'בת ים=', 'matchCities: "בת ים" does not add קריית ים (got ' + rows('בת ים', 0) + ')');
    assert(rows('עזריאלי', 3) === '', 'matchCities: "עזריאלי" with 3 locations offers no city עזריאל (got ' + rows('עזריאלי', 3) + ')');
    assert(found('ספריה') === '10', 'search: "ספריה" finds the library');

    // === matchCities tests (the cities in the suggestion list; Enter picks only a "same" city) ===
    const counts = new Map([['רמלה', 31], ['חדרה', 42], ['גדרה', 9], ['תל אביב', 375], ['שאג\'ור', 3], ['מגדל', 4], ['מגדל העמק', 20], ['אליפז', 1], ['נוף הגליל', 16], ['רגבה', 2], ['פתח תקווה', 140], ['תקומה', 1], ['לוד', 11], ['לוט', 1], ['ירושלים', 178]]);
    const cityList = text => matchCities(counts, text).map(c => c.name + (c.same ? '=' : c.exact ? '' : '~')).join(',');
    assert(cityList('מגה') === '', 'matchCities: "מגה" offers no city (was רמלה) (got ' + cityList('מגה') + ')');
    assert(cityList('באג') === '', 'matchCities: "באג" offers no city (was שאג\'ור)');
    assert(cityList('דלק') === '', 'matchCities: "דלק" offers no city (was מגדל)');
    assert(cityList('לוד') === 'לוד=', 'matchCities: 3-letter city name has no near-miss city (got ' + cityList('לוד') + ')');
    assert(cityList('חדרה') === 'חדרה=', 'matchCities: 4-letter city name has no near-miss city (got ' + cityList('חדרה') + ')');
    assert(cityList('פז') === 'אליפז' && matchCities(counts, 'פז')[0].same === false, 'matchCities: "פז" is inside אליפז but is not that city, so Enter does not pick it');
    assert(cityList('גלי') === 'נוף הגליל', 'matchCities: "גלי" is part of a city name, not a city');
    assert(cityList('ר"ג') === '', 'matchCities: ר"ג offers no near-miss (was רגבה); רמת גן is not in this list');
    assert(cityList('תקוה') === 'פתח תקווה', 'matchCities: "תקוה" offers פתח תקווה, not תקומה (got ' + cityList('תקוה') + ')');
    assert(cityList('ת"א') === 'תל אביב=', 'matchCities: ת"א is the city תל אביב');
    assert(cityList('תל אביב יפו') === 'תל אביב=', 'matchCities: "תל אביב יפו" is the city תל אביב');
    assert(cityList('פתח תקוה') === 'פתח תקווה=', 'matchCities: "פתח תקוה" is the city פתח תקווה');
    assert(cityList('מגדל') === 'מגדל=,מגדל העמק', 'matchCities: the city that was typed comes before a bigger city containing it (got ' + cityList('מגדל') + ')');
    assert(cityList('ירושלם') === 'ירושלים~', 'matchCities: a 6-letter typing mistake still offers the city, marked as not the same');
    assert(cityList('') === '', 'matchCities: empty text offers nothing');

    // === isValidLocation tests (the filter applied to locations.json when it loads) ===
    const goodLoc = { id: 100, name: 'א', address: 'ב', city: 'ג', type: 'store', lat: 32.1, lng: 34.8 };
    const withField = (key, value) => Object.assign({}, goodLoc, { [key]: value });
    assert(isValidLocation(goodLoc) === true, 'isValidLocation: a complete record passes');
    assert(isValidLocation(withField('id', '1"><img src=x onerror=alert(1)>')) === false, 'isValidLocation: id with markup is rejected');
    assert(isValidLocation(withField('id', '100')) === false, 'isValidLocation: id as a string is rejected');
    assert(isValidLocation(withField('id', 1.5)) === false, 'isValidLocation: id that is not a whole number is rejected');
    assert(isValidLocation(withField('id', 0)) === false, 'isValidLocation: id 0 is rejected');
    assert(isValidLocation(withField('lat', '32.1')) === false, 'isValidLocation: lat as a string is rejected');
    assert(isValidLocation(withField('lng', null)) === false, 'isValidLocation: missing lng is rejected');
    assert(isValidLocation(withField('lat', 0)) === false, 'isValidLocation: lat 0 (outside Israel) is rejected');
    assert(isValidLocation(withField('lat', NaN)) === false, 'isValidLocation: NaN is rejected');
    assert(isValidLocation(withField('type', 'shop')) === false, 'isValidLocation: unknown type is rejected');
    assert(isValidLocation(withField('name', '')) === false, 'isValidLocation: empty name is rejected');
    assert(isValidLocation(null) === false, 'isValidLocation: null is rejected');

    // === getDistance tests ===
    const d1 = getDistance(32.0853, 34.7818, 31.7683, 35.2137); // Tel Aviv to Jerusalem
    assert(d1 > 50 && d1 < 70, 'getDistance: Tel Aviv to Jerusalem ~60km (got ' + d1.toFixed(1) + ')');
    const d2 = getDistance(32.0853, 34.7818, 32.0853, 34.7818); // Same point
    assert(d2 === 0, 'getDistance: same point = 0');
    const d3 = getDistance(31.2530, 34.7915, 31.0461, 35.1489); // Beer Sheva to Arad
    assert(d3 > 30 && d3 < 50, 'getDistance: Beer Sheva to Arad ~40km (got ' + d3.toFixed(1) + ')');

    // === formatDistance tests ===
    assert(formatDistance(0.35) === '350\u00A0\u05DE\u05F3', 'formatDistance: 0.35 km is shown as 350 metres');
    assert(formatDistance(0.04) === '40\u00A0\u05DE\u05F3', 'formatDistance: 0.04 km is 40 metres, not "0.0 km"');
    assert(formatDistance(0.3549) === '350\u00A0\u05DE\u05F3', 'formatDistance: metres are rounded to the nearest 10');
    assert(formatDistance(0) === '0\u00A0\u05DE\u05F3', 'formatDistance: 0 is 0 metres');
    assert(formatDistance(0.994) === '990\u00A0\u05DE\u05F3', 'formatDistance: 994 m stays in metres');
    assert(formatDistance(0.996) === '1.0\u00A0\u05E7"\u05DE', 'formatDistance: 996 m rounds up to 1.0 km, never "1000 metres"');
    assert(formatDistance(1) === '1.0\u00A0\u05E7"\u05DE', 'formatDistance: 1 km is shown in km');
    assert(formatDistance(12.34) === '12.3\u00A0\u05E7"\u05DE', 'formatDistance: km keep one decimal');
    assert(!/ /.test(formatDistance(0.07)) && !/ /.test(formatDistance(12.34)), 'formatDistance: the number and its unit are joined by a no-break space, so they never wrap apart');
    assert(!formatDistance(0.04).includes('0.0'), 'formatDistance: never "0.0"');

    // Chain detection lives in scraper.js and is tested by test-scraper.js (node --test)

    // === XSS escaping edge cases ===
    assert(escapeHtml('<svg onload=alert(1)>') === '&lt;svg onload=alert(1)&gt;', 'escapeHtml: SVG onclick escaped');
    assert(escapeHtml('javascript:alert(1)') === 'javascript:alert(1)', 'escapeHtml: javascript: URL passes through (safe as text)');
    assert(escapeHtml('<img src=x onerror=alert(1)>') === '&lt;img src=x onerror=alert(1)&gt;', 'escapeHtml: img onerror escaped');
    assert(escapeHtml('data:text/html,<script>alert(1)<\/script>').includes('&lt;script&gt;'), 'escapeHtml: data: URI script escaped');
    assert(escapeHtml('<div onmouseover="alert(1)">').includes('&lt;div'), 'escapeHtml: div onmouseover escaped');

    // === "hours" filter logic ===
    const hoursFilter = (hours) => hours && hours !== '\u05D1\u05D3\u05D5\u05E7 \u05D1\u05D0\u05EA\u05E8';
    assert(hoursFilter('\u05D1\u05D3\u05D5\u05E7 \u05D1\u05D0\u05EA\u05E8') === false, 'hoursFilter: filters out "\u05D1\u05D3\u05D5\u05E7 \u05D1\u05D0\u05EA\u05E8"');
    assert(hoursFilter('08:00-20:00') === true, 'hoursFilter: keeps real hours');
    assert(!hoursFilter(''), 'hoursFilter: filters empty string');
    assert(!hoursFilter(null), 'hoursFilter: filters null');
    assert(!hoursFilter(undefined), 'hoursFilter: filters undefined');

    // === Chains that MAI does not list: the empty state says so ===
    const NOT_LISTED = 'הרשת הזו לא מופיעה ברשימת נקודות האיסוף של תאגיד מ.א.י.';
    ['סופר פארם', 'super pharm', 'Super-Pharm', 'סופר-פארם', 'סופרפארם', 'אופיס דיפו', 'Office Depot', 'KSP', 'ksp', 'פלאפון', 'סלקום', '  סופר פארם  ', 'סופר פארם חיפה', 'פלאפון, תל אביב'].forEach(text => {
        assert(chainNotListedText(text) === NOT_LISTED, 'chainNotListedText: "' + text + '" is a chain MAI does not list');
    });
    ['', '   ', 'סופר', 'פארם', 'שופרסל', 'מגה', 'חיפה', 'kspx', 'aksp', 'סלקומים', 'office'].forEach(text => {
        assert(chainNotListedText(text) === '', 'chainNotListedText: "' + text + '" gets the usual empty-state text');
    });

    // === "עודכן <date>" in the credit line, from data_meta.json ===
    assert(formatUpdatedDate('2026-11-26T20:31:58.275Z') === '26.11.2026', 'formatUpdatedDate: d.m.yyyy, no leading zeros');
    assert(formatUpdatedDate('2026-11-26T22:30:00Z') === '27.11.2026', 'formatUpdatedDate: the date in Israel, not in London (00:30 the next day)');
    assert(formatUpdatedDate('2026-03-05T08:00:00Z') === '5.3.2026', 'formatUpdatedDate: one-digit day and month');
    assert(formatUpdatedDate('2026-07-01T00:00:00+03:00') === '1.7.2026', 'formatUpdatedDate: an offset in the text is respected');
    assert(formatUpdatedDate('2026-02-30T00:00:00Z') === '' && formatUpdatedDate('2026-13-01T00:00:00Z') === '', 'formatUpdatedDate: an impossible date (30 February, month 13) gives nothing, not a rolled-over date');
    [undefined, null, '', 'yesterday', '2026', '2026-13-45T00:00:00Z', 12345, {}, '<img src=x>'].forEach(value => {
        assert(formatUpdatedDate(value) === '', 'formatUpdatedDate: ' + JSON.stringify(value) + ' gives no date');
    });

    // === Summary ===
    const summary = document.getElementById('summary');
    summary.className = 'summary ' + (failed === 0 ? 'all-pass' : 'has-fail');
    summary.textContent = passed + ' passed, ' + failed + ' failed out of ' + (passed + failed) + ' tests';
    </script>
</body>
</html>
