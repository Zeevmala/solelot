const EARTH_RADIUS_KM = 6371;

const REPORT_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSey-yMW6dMKCiq0mPqdWdNTa3ccg0xQ6zn-Ca_3f6jiOMCbng/viewform';

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function fuzzyMatch(text, query, maxDist = 2) {
    if (!text || !query) return false;
    if (text.includes(query)) return true;
    if (query.length <= 2) return false; // too short for fuzzy
    if (Math.abs(text.length - query.length) > 3) return false; // too different to match

    // Sliding window Levenshtein: check if any substring of text
    // of length ~query.length is within maxDist edits
    const qLen = query.length;
    const tLen = text.length;

    // Initialize DP row — allow free start position in text
    let prev = new Array(qLen + 1);
    for (let j = 0; j <= qLen; j++) prev[j] = j;

    for (let i = 1; i <= tLen; i++) {
        const curr = new Array(qLen + 1);
        curr[0] = 0; // free start position
        for (let j = 1; j <= qLen; j++) {
            const cost = text[i - 1] === query[j - 1] ? 0 : 1;
            curr[j] = Math.min(
                prev[j] + 1,      // deletion
                curr[j - 1] + 1,  // insertion
                prev[j - 1] + cost // substitution
            );
        }
        // Check if we found a good enough match ending here
        if (curr[qLen] <= maxDist) return true;
        prev = curr;
    }
    return false;
}

function normalizeText(text, keepDoubled = false) {
    let result = String(text || '')
        .toLowerCase()
        .replace(/["'\u05F4\u201C\u201D\u05F3\u2018\u2019]/g, '')
        .replace(/[-\u05BE\u2013]/g, ' ');
    if (!keepDoubled) result = result.replace(/י+/g, 'י').replace(/ו+/g, 'ו');
    return result.replace(/\s+/g, ' ').trim();
}

function normalizeQuery(text, keepDoubled = false) {
    const query = normalizeText(text);
    const typedQuote = /["\u05F4\u201C\u201D]/.test(String(text || ''));
    const alias = Object.keys(QUERY_ALIASES).find(name =>
        normalizeText(name) === query && (typedQuote || !name.includes('"')));
    return normalizeText(alias ? QUERY_ALIASES[alias] : text, keepDoubled);
}

function locationSearchText(location) {
    const text = [location.name, location.address, location.city].join(' ').replace(/,/g, ' ');
    return { folded: normalizeText(text), asTyped: normalizeText(text, true) };
}


function findContaining(locations, query) {
    const texts = locations.map(location => location.searchText || locationSearchText(location));
    const withAll = (words, kind) => locations.filter((location, i) => words.every(word => texts[i][kind].includes(word)));
    const typed = String(query || '').replace(/,/g, ' '); // an address pasted as written
    const asTyped = normalizeQuery(typed, true);
    const folded = normalizeQuery(typed);
    if (asTyped !== folded) {
        const found = withAll(asTyped.split(' '), 'asTyped');
        if (found.length > 0) return found;
    }
    return withAll(folded.split(' '), 'folded');
}


function matchCities(cityCounts, text, exactLocationCount = 0) {
    const query = normalizeQuery(text);
    const maxDist = fuzzyTolerance(query.length);
    const matches = [];
    if (query === '') return matches;
    cityCounts.forEach((count, name) => {
        const city = normalizeText(name);
        if (city.includes(query)) matches.push({ type: 'city', name, count, exact: true, same: city === query });
    });
    if (matches.length === 0 && exactLocationCount === 0 && maxDist > 0) {
        cityCounts.forEach((count, name) => {
            if (fuzzyMatch(normalizeText(name), query, maxDist)) {
                matches.push({ type: 'city', name, count, exact: false, same: false });
            }
        });
    }
    // The city that is the typed text first, then cities containing it, then near
    // matches; inside each group the city with more locations first
    matches.sort((a, b) => {
        if (a.same !== b.same) return a.same ? -1 : 1;
        if (a.exact !== b.exact) return a.exact ? -1 : 1;
        return b.count - a.count;
    });
    return matches;
}


function fuzzyTolerance(queryLength) {
    if (queryLength < 5) return 0;
    if (queryLength < 8) return 1;
    return 2;
}

function searchLocations(locations, query, cityFilter) {
    if (cityFilter) return locations.filter(location => location.city === cityFilter);

    const q = normalizeQuery(query);
    if (q === '') return locations.slice();

    const exact = findContaining(locations, query);
    if (exact.length > 0) return exact;

    const maxDist = fuzzyTolerance(q.length);
    if (maxDist === 0) return [];
    const fields = locations.map(location => [
        normalizeText(location.name),
        normalizeText(location.address),
        normalizeText(location.city)
    ]);
    return locations.filter((location, i) => fields[i].some(text => fuzzyMatch(text, q, maxDist)));
}

var userLocation = null;

function getDistance(lat1, lng1, lat2, lng2) {
    const R = EARTH_RADIUS_KM;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function formatDistance(km) {
    const metres = Math.round(km * 100) * 10;
    if (metres < 1000) return `${metres} מ׳`;
    return `${km.toFixed(1)} ק"מ`;
}

function getReportUrl(location) {

        'entry.1466478113': location.name,
        'entry.1234054889': location.address,
        'entry.1388870063': location.city,
        'hl': 'he'
    });
    return `${REPORT_FORM_URL}?${params.toString()}`;
}

function getConfirmUrl(location) {

        'entry.1466478113': '✔ הנקודה קיימת: ' + location.name,
        'entry.1234054889': location.address,

        'hl': 'he'

    return `${REPORT_FORM_URL}?${params.toString()}`;
}

function pointKindText(location) {
    const names = { fuel: 'תחנת דלק', shop: 'חנות', municipal: 'נקודת איסוף עירונית' };
    const kind = location ? location.kind : undefined;
    return typeof kind === 'string' && Object.prototype.hasOwnProperty.call(names, kind) ? names[kind] : '';
}

function createSidebarContent(location) {
    const hasAddress = location.address && location.address !== 'Unknown' && location.address !== location.name;

    const meta = [];
    if (userLocation) {
        const distance = getDistance(
            userLocation.lat, userLocation.lng,
            location.lat, location.lng
        );
        meta.push(`<span class="distance">${formatDistance(distance)} בקו אווירי</span>`);
    }
    if (hasAddress) meta.push(`<span class="sidebar-address">${escapeHtml(location.address)}</span>`);
    const kind = pointKindText(location);

    const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${location.lat},${location.lng}`;
    const wazeUrl = `https://waze.com/ul?ll=${location.lat},${location.lng}&navigate=yes`;

    return `
        <div class="sidebar-header">
            <div class="sidebar-title">
                <h2 tabindex="-1">${escapeHtml(location.name)}</h2>
                ${location.type === 'facility' ? `<span class="type-badge">${typeNames.facility}</span>` : ''}

        </div>

        <div class="feedback-row">
            <button type="button" class="feedback-btn like-btn" data-like-id="${location.id}" data-confirm-url="${escapeHtml(getConfirmUrl(location))}" aria-label="הנקודה קיימת - אישור בטופס">

                ${thumbsDownSvg}<span>דיווח על בעיה</span>
            </button>
        </div>
    `;
}
    // <<< END OF COPIES

    // Test helper: does the real search (searchLocations, copied above) show this one location?

            assert(invalidTypes === 0, 'All types are "store" or "facility"' + (invalidTypes > 0 ? ' \u2014 ' + invalidTypes + ' invalid' : ''));
            assert(emptyNames === 0, 'No empty location names');

            var infoDiv = document.createElement('div');

            assert(!detailsNoHours.includes('\uD83D\uDD50'), 'Details: no clock icon when no hours');

            // --- The sheet: name, one meta line, the kind, navigate, feedback (design great-map A8) ---
            section('Sheet Order, Kind and Feedback Labels');
            var feedback = createSidebarContent(testLoc);
            assert(/<button[^>]*like-btn[^>]*aria-label="הנקודה קיימת - אישור בטופס"[^>]*>[\s\S]*?<span>הנקודה קיימת<\/span>/.test(feedback), 'Sheet: the thumbs-up button shows "הנקודה קיימת" and its name starts with it');
            assert(/<button[^>]*dislike-btn[^>]*aria-label="דיווח על בעיה"[^>]*>[\s\S]*?<span>דיווח על בעיה<\/span>/.test(feedback), 'Sheet: the thumbs-down button shows "דיווח על בעיה", the same as its name');
            var emojiRe = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u;
            var fullLoc = { id: 4, name: 'חנות', address: 'הרצל 1, חיפה', city: 'חיפה', lat: 32.8, lng: 35.0, type: 'store', hours: '08:00-20:00', description: 'ליד הקופה', kind: 'fuel' };
            userLocation = { lat: 32.79, lng: 35.0 };
            var full = createSidebarContent(fullLoc);
            assert(!emojiRe.test(full), 'Sheet: no emoji, with distance, hours and description');
            var order = ['<h2', 'class="sidebar-meta"', 'class="sidebar-kind"', 'class="sidebar-nav"', 'class="feedback-row"'].map(function(part) { return full.indexOf(part); });
            assert(order.every(function(at, i) { return at >= 0 && (i === 0 || at > order[i - 1]); }), 'Sheet: name, meta line, kind, navigate, feedback in that order (' + order.join(', ') + ')');
            assert(/<p class="sidebar-meta"><span class="distance">[^<]+ בקו אווירי<\/span><span class="meta-sep" aria-hidden="true"> · <\/span><span class="sidebar-address">הרצל 1, חיפה<\/span><\/p>/.test(full), 'Sheet: one meta line, the distance first, then the address');
            userLocation = null;
            var noDistance = createSidebarContent(fullLoc);
            assert(/<p class="sidebar-meta"><span class="sidebar-address">הרצל 1, חיפה<\/span><\/p>/.test(noDistance), 'Sheet: not located, the meta line is the address alone');

            section('Point Kind');
            assert(pointKindText({ kind: 'fuel' }) === 'תחנת דלק', 'Kind: fuel is "תחנת דלק"');
            assert(pointKindText({ kind: 'shop' }) === 'חנות', 'Kind: shop is "חנות"');
            assert(pointKindText({ kind: 'municipal' }) === 'נקודת איסוף עירונית', 'Kind: municipal is "נקודת איסוף עירונית"');
            assert(pointKindText({}) === '', 'Kind: a record without kind has no kind line');
            assert(pointKindText({ kind: null }) === '' && pointKindText({ kind: '' }) === '', 'Kind: an empty kind has no kind line');
            assert(pointKindText({ kind: 'school' }) === '' && pointKindText({ kind: 'toString' }) === '' && pointKindText({ kind: '__proto__' }) === '', 'Kind: an unknown value has no kind line');
            assert(createSidebarContent(fullLoc).includes('<p class="sidebar-kind">תחנת דלק</p>'), 'Sheet: a fuel station says "תחנת דלק"');
            assert(createSidebarContent({ id: 5, name: 'עירייה', address: 'כיכר 1', city: 'לוד', lat: 31.9, lng: 34.9, type: 'store', kind: 'municipal' }).includes('<p class="sidebar-kind">נקודת איסוף עירונית</p>'), 'Sheet: a municipal point says "נקודת איסוף עירונית"');
            assert(!createSidebarContent(testLoc).includes('sidebar-kind'), 'Sheet: no kind line when the record has no kind');
            var realWithKind = locations.filter(function(loc) { return loc.kind !== undefined; });
            assert(realWithKind.every(function(loc) { return pointKindText(loc) !== ''; }), 'Data: every kind in locations.json has a text (' + realWithKind.length + ' records have a kind)');

            // --- Sidebar template tests ---
            section('Sidebar Template');
            var sidebar = createSidebarContent(testLoc);

            assert(!sidebar.includes('sidebar-icon'), 'Sidebar: no pin icon div');
            assert(sidebar.indexOf('sidebar-nav-btn waze') < sidebar.indexOf('sidebar-nav-btn google'), 'Sidebar: Waze first (on the right), then Google Maps; both the same kind of button');
            assert(sidebar.includes('sidebar-nav-btn google'), 'Sidebar: Google button has correct class');
            assert(sidebar.includes('sidebar-nav-btn waze'), 'Sidebar: Waze button has correct class');
            assert(!sidebar.includes('\uD83D\uDCCD'), 'Sidebar: no pin emoji in address');
            assert(sidebar.includes('<h2 tabindex="-1">'), 'Sidebar: the heading can take the focus (the phone sheet has no close button)');

            var sidebarBad = createSidebarContent(testLocBadHours);
            assert(!sidebarBad.includes('\u05D1\u05D3\u05D5\u05E7 \u05D1\u05D0\u05EA\u05E8'), 'Sidebar: "\u05D1\u05D3\u05D5\u05E7 \u05D1\u05D0\u05EA\u05E8" filtered out');

            // --- XSS protection ---
            section('XSS Protection');
            var xssLoc = { id: 99, name: '<scr' + 'ipt>alert(1)<\/scr' + 'ipt>', address: '"><img onerror=alert(1)>', city: 'test', lat: 32.0, lng: 34.8, type: 'store' };
            var xssDetails = createSidebarContent(xssLoc);
            assert(!xssDetails.includes('<scr' + 'ipt>'), 'XSS: script tag escaped in details');
            assert(!xssDetails.includes('<img'), 'XSS: img tag escaped in details');
            var xssSidebar = createSidebarContent(xssLoc);
            assert(!xssSidebar.includes('<scr' + 'ipt>'), 'XSS: script tag escaped in sidebar');

            // --- Navigation URLs ---
            section('Navigation URLs');
            assert(details.includes('google.com/maps/dir'), 'Nav: Google Maps URL present');
            assert(details.includes('waze.com/ul'), 'Nav: Waze URL present');
            assert(details.includes('destination=32.08,34.78'), 'Nav: correct coordinates in URL');

            // ======================================
            // NEW INTEGRATION TESTS
            // ======================================

            // --- Search Filtering Logic ---
            section('Search Filtering Logic');
            var searchLoc = { name: '\u05E1\u05D5\u05E4\u05E8 \u05E4\u05D0\u05E8\u05DD \u05EA\u05DC \u05D0\u05D1\u05D9\u05D1', address: '\u05E8\u05D7\u05D5\u05D1 \u05D4\u05E8\u05E6\u05DC 10', city: '\u05EA\u05DC \u05D0\u05D1\u05D9\u05D1' };

            assert(searchMatch(searchLoc, '') === true, 'Search: empty query matches everything');
            assert(searchMatch(searchLoc, '\u05EA\u05DC \u05D0\u05D1\u05D9\u05D1') === true, 'Search: exact city name matches');
            assert(searchMatch(searchLoc, '\u05E1\u05D5\u05E4\u05E8 \u05E4\u05D0\u05E8\u05DD') === true, 'Search: location name substring matches');
            assert(searchMatch(searchLoc, '\u05D4\u05E8\u05E6\u05DC') === true, 'Search: address substring matches');
            assert(searchMatch(searchLoc, '\u05EA\u05DC \u05D0\u05D1\u05D9\u05D1\u05D9') === true, 'Search: fuzzy match (1-char typo) matches');
            assert(searchMatch(searchLoc, '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD') === false, 'Search: non-matching query returns false');
            assert(searchMatch(searchLoc, 'xyz') === false, 'Search: English nonsense returns false');

            var searchLoc2 = { name: '\u05E9\u05D5\u05E4\u05E8\u05E1\u05DC \u05D3\u05D9\u05DC', address: '\u05D9\u05D2\u05D0\u05DC 5', city: '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD' };
            assert(searchMatch(searchLoc2, '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD') === true, 'Search: Hebrew city "\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD" matches');
            assert(searchMatch(searchLoc2, '\u05E9\u05D5\u05E4\u05E8\u05E1\u05DC') === true, 'Search: chain name matches in name field');

            // Test filtering a list (simulates updateMarkers loop)
            var testLocations = [
                { name: '\u05E1\u05D5\u05E4\u05E8 \u05E4\u05D0\u05E8\u05DD', address: '\u05E8\u05D7\u05D5\u05D1', city: '\u05EA\u05DC \u05D0\u05D1\u05D9\u05D1' },
                { name: '\u05E9\u05D5\u05E4\u05E8\u05E1\u05DC', address: '\u05D4\u05E8\u05E6\u05DC', city: '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD' },
                { name: '\u05D0\u05D5\u05E4\u05D9\u05E1 \u05D3\u05D9\u05E4\u05D5', address: '\u05D4\u05E0\u05E9\u05D9\u05D0', city: '\u05D7\u05D9\u05E4\u05D4' }
            ];
            var filtered = testLocations.filter(function(loc) { return searchMatch(loc, '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD'); });
            assert(filtered.length === 1, 'Search: filtering list by city returns 1 match');
            assert(filtered[0].city === '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD', 'Search: filtered result is the correct city');

            var filteredAll = testLocations.filter(function(loc) { return searchMatch(loc, ''); });
            assert(filteredAll.length === 3, 'Search: empty query returns all locations');

            // Search on the real data (the launch-readiness "Done when" checks)
            var hadera = '\u05D7\u05D3\u05E8\u05D4', lod = '\u05DC\u05D5\u05D3';
            var haderaOwn = locations.filter(function(loc) { return loc.city === hadera; }).length;
            var haderaPicked = searchLocations(locations, hadera, hadera);
            assert(haderaOwn > 0 && haderaPicked.length === haderaOwn && haderaPicked.every(function(loc) { return loc.city === hadera; }),
                'Search: picking the city \u05D7\u05D3\u05E8\u05D4 shows exactly its points (' + haderaPicked.length + ' of ' + haderaOwn + ')');
            var lodTyped = searchLocations(locations, lod, null);
            assert(lodTyped.length > 0 && lodTyped.every(function(loc) { return (loc.name + '|' + loc.address + '|' + loc.city).indexOf(lod) !== -1; }),
                'Search: typing "\u05DC\u05D5\u05D3" shows only points containing it (' + lodTyped.length + ')');
            assert(searchLocations(locations, 'ksp', null).length === searchLocations(locations, 'KSP', null).length, 'Search: "ksp" equals "KSP"');
            var tlv = '\u05EA\u05DC \u05D0\u05D1\u05D9\u05D1';
            assert(searchLocations(locations, tlv + ' \u05D9\u05E4\u05D5', null).length === searchLocations(locations, tlv, null).length,
                'Search: "\u05EA\u05DC \u05D0\u05D1\u05D9\u05D1 \u05D9\u05E4\u05D5" gives the same points as "\u05EA\u05DC \u05D0\u05D1\u05D9\u05D1"');

            // Words in any order, doubled letters, aliases (great-map A3), on the real data.
            // The page builds the search text once per location when the data loads; so does this test.
            locations.forEach(function(loc) { loc.searchText = locationSearchText(loc); });
            var sample = locations.filter(function(loc, i) { return i % 8 === 0; }).slice(0, 400);
            var missed = sample.filter(function(loc) {
                var street = loc.address.split(',')[0].replace(/[0-9]+/g, ' ').trim();
                return searchLocations(locations, street + ' ' + loc.city, null).indexOf(loc) === -1;
            });
            assert(sample.length === 400 && missed.length < 20, 'Search: "street city" finds its own point for at least 95% of 400 addresses (' + missed.length + ' missed' + (missed[0] ? ', e.g. ' + missed[0].address : '') + ')');
            var gvirol = searchLocations(locations, 'אבן גבירול תל אביב', null);
            assert(gvirol.length > 0 && gvirol.every(function(loc) { return loc.city === tlv && (loc.name + loc.address).indexOf('אבן גבירול') !== -1; }),
                'Search: "אבן גבירול תל אביב" shows only אבן גבירול in תל אביב (' + gvirol.length + ')');
            var ace = searchLocations(locations, 'אייס', null);
            var aceRaw = locations.filter(function(loc) { return (loc.name + '|' + loc.address + '|' + loc.city).indexOf('אייס') !== -1; }).length;
            assert(ace.length > 0 && ace.length === aceRaw, 'Search: "אייס" shows only the ' + aceRaw + ' records containing it (got ' + ace.length + ')');
            var ptk = searchLocations(locations, 'פתח תקוה', null).filter(function(loc) { return loc.city === 'פתח תקווה'; }).length;
            var ptkOwn = locations.filter(function(loc) { return loc.city === 'פתח תקווה'; }).length;
            assert(ptkOwn > 0 && ptk === ptkOwn, 'Search: "פתח תקוה" finds all ' + ptkOwn + ' points of פתח תקווה (got ' + ptk + ')');
            var kiryat = searchLocations(locations, 'קרית אתא', null);
            assert(kiryat.length > 0 && kiryat.every(function(loc) { return (loc.name + loc.address + loc.city).indexOf('קריית אתא') !== -1 || (loc.name + loc.address + loc.city).indexOf('קרית אתא') !== -1; }), 'Search: "קרית אתא" finds קריית אתא (' + kiryat.length + ')');
            ['jerusalem', 'haifa', 'beer sheva', 'petah tikva', 'rishon lezion', 'netanya', 'ashdod', 'holon', 'ramat gan', 'bnei brak', 'eilat', 'כ"ס', 'bug', 'ikea', 'ace', 'אם פם', 'ampm', 'am:pm'].forEach(function(typed) {
                assert(searchLocations(locations, typed, null).length > 0, 'Search: alias "' + typed + '" finds points on the map');
            });
            var cityCountsReal = new Map();
            locations.forEach(function(loc) { cityCountsReal.set(loc.city, (cityCountsReal.get(loc.city) || 0) + 1); });
            assert(matchCities(cityCountsReal, 'ספריה', findContaining(locations, 'ספריה').length).length === 0, 'Suggestions: "ספריה" offers no city row (it is found in locations)');
            assert(matchCities(cityCountsReal, 'קרית אתא', findContaining(locations, 'קרית אתא').length).map(function(c) { return c.name; }).join() === 'קריית אתא', 'Suggestions: "קרית אתא" offers exactly one city');

            // --- Sidebar State Machine ---
            section('Sidebar State Machine');
            var mockSidebar = document.createElement('aside');
            mockSidebar.style.display = 'none';
            mockSidebar.classList.add('hidden');
            var mockSidebarContent = document.createElement('div');
            var selectedLocationId = null;

            // Simulate showSidebar
            function testShowSidebar(location) {
                selectedLocationId = location.id;
                mockSidebarContent.innerHTML = createSidebarContent(location);
                mockSidebar.style.display = 'flex';
                mockSidebar.classList.remove('hidden');
            }

            // Simulate hideSidebar
            function testHideSidebar() {
                mockSidebar.classList.add('hidden');
                mockSidebar.style.display = 'none';
                selectedLocationId = null;
            }

            testShowSidebar(testLoc);
            assert(mockSidebar.style.display === 'flex', 'Sidebar: showSidebar sets display to flex');
            assert(!mockSidebar.classList.contains('hidden'), 'Sidebar: showSidebar removes hidden class');
            assert(mockSidebarContent.innerHTML.length > 0, 'Sidebar: showSidebar populates content');
            assert(selectedLocationId === 1, 'Sidebar: showSidebar sets selectedLocationId');

            testHideSidebar();
            assert(mockSidebar.classList.contains('hidden'), 'Sidebar: hideSidebar adds hidden class');
            assert(selectedLocationId === null, 'Sidebar: hideSidebar clears selectedLocationId');

            // Show twice — content should be replaced
            testShowSidebar(testLoc);
            var firstContent = mockSidebarContent.innerHTML;
            var testLoc2 = { id: 7, name: '\u05E9\u05D5\u05E4\u05E8\u05E1\u05DC \u05D3\u05D9\u05DC', address: '\u05D9\u05D2\u05D0\u05DC 5', city: '\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD', lat: 31.77, lng: 35.21, type: 'store', hours: '07:00-23:00' };
            testShowSidebar(testLoc2);
            assert(mockSidebarContent.innerHTML !== firstContent, 'Sidebar: calling showSidebar twice replaces content');
            assert(selectedLocationId === 7, 'Sidebar: second showSidebar updates selectedLocationId');

            // --- GPS Distance Integration ---
            section('GPS Distance Integration');

            // Without userLocation — no distance row
            userLocation = null;
            var detailsNoDist = createSidebarContent(testLoc);
            assert(!detailsNoDist.includes('בקו אווירי'), 'GPS: no distance row without userLocation');

            // With userLocation — distance row present
            userLocation = { lat: 32.0853, lng: 34.7818 }; // Tel Aviv center
            var detailsWithDist = createSidebarContent(testLoc);
            assert(detailsWithDist.includes('\u05DE\u05F3 בקו אווירי'), 'GPS: distance row present with userLocation, in metres under 1 km, said to be straight-line');
            assert(!detailsWithDist.includes('\u05E7"\u05DE'), 'GPS: no km for a point under 1 km away');
            assert(detailsWithDist.includes('distance'), 'GPS: distance row has "distance" class');

            // Distance value is reasonable
            var expectedDist = getDistance(32.0853, 34.7818, 32.08, 34.78);
            assert(expectedDist < 1, 'GPS: distance to nearby point is < 1 km (got ' + expectedDist.toFixed(2) + ')');
            assert(detailsWithDist.includes('>' + Math.round(expectedDist * 100) * 10 + ' \u05DE\u05F3 '), 'GPS: details show correct distance value');
            var sidebarWithDist = createSidebarContent(testLoc);
            assert(sidebarWithDist.includes('>' + Math.round(expectedDist * 100) * 10 + ' \u05DE\u05F3 בקו אווירי<'), 'GPS: sidebar shows the same distance in metres, said to be straight-line');

            // Distance to Jerusalem
            var jlmLoc = { id: 10, name: 'Test', address: 'Test', city: 'Test', lat: 31.7683, lng: 35.2137, type: 'store' };
            var detailsJlm = createSidebarContent(jlmLoc);
            var jlmDist = getDistance(32.0853, 34.7818, 31.7683, 35.2137);
            assert(jlmDist > 50 && jlmDist < 70, 'GPS: TLV to Jerusalem distance ~60km (got ' + jlmDist.toFixed(1) + ')');
            assert(detailsJlm.includes(jlmDist.toFixed(1) + ' \u05E7"\u05DE בקו אווירי'), 'GPS: Jerusalem details show correct distance in km, said to be straight-line');

            // Reset userLocation
            userLocation = null;

            // --- Summary ---
            var summary = document.getElementById('summary');
            summary.className = 'summary ' + (failed === 0 ? 'all-pass' : 'has-fail');
            summary.textContent = passed + ' passed, ' + failed + ' failed out of ' + (passed + failed) + ' tests';
        })
        .catch(function(err) {
            var div = document.createElement('div');
            div.className = 'test fail';
            div.textContent = '\u274C Failed to load locations.json: ' + err.message;
            results.appendChild(div);

            var summary = document.getElementById('summary');
            summary.className = 'summary has-fail';
            summary.textContent = 'Tests could not run - locations.json failed to load';
        });
    </script>
</body>
</html>
